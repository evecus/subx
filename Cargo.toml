[package]
name = "subx"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "Sub-Store 订阅转换服务"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
rand = "0.8"
regex = "1"
chrono = "0.4"
percent-encoding = "2"
mime_guess = "2"
rust-embed = { version = "8", features = ["debug-embed"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
parking_lot = "0.12"

[profile.release]
opt-level = 2
debug = false
strip = true
panic = "abort"